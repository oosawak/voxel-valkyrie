<script>
// =========================================================
// AUDIO SYNTHESIZER (Web Audio API)
// =========================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTransformSound(formIdx) {
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    const base = [220, 310, 420][formIdx] || 280;
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(base, now + 0.18);
    osc.frequency.exponentialRampToValueAtTime(base * 0.75, now + 0.36);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  } catch (e) {}
}
function playShootSound(isMissile = false) {
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = isMissile ? 'triangle' : 'square';
    osc.frequency.setValueAtTime(isMissile ? 520 : 860, now);
    osc.frequency.exponentialRampToValueAtTime(isMissile ? 110 : 180, now + (isMissile ? 0.24 : 0.08));
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (isMissile ? 0.25 : 0.09));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (isMissile ? 0.26 : 0.1));
  } catch (e) {}
}
function playExplosionSound() {
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.35;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(420, now);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  } catch (e) {}
}

// =========================================================
// VOXEL MODEL DEFINITIONS (HERO & ENEMY x 3 FORMS)
// =========================================================
const HERO_PALETTE = {
  1: 0xe6ebf5, 2: 0x9ba5b4, 3: 0xdc2d32, 4: 0x373c46,
  5: 0x23aff0, 6: 0xa5ebff, 7: 0xffa01e, 8: 0xfff096, 9: 0x284182
};
const ENEMY_PALETTE = {
  1: 0x2a2e38, 2: 0x181a20, 3: 0x9b2ddc, 4: 0x4b525f,
  5: 0xff2d4b, 6: 0xff96aa, 7: 0xbe3cff, 8: 0xf5beff, 9: 0x8c192d
};

function createGrid(X, Y, Z) {
  return { X, Y, Z, data: new Uint8Array(X * Y * Z) };
}
function setVoxel(g, x, y, z, c) {
  if (x >= 0 && x < g.X && y >= 0 && y < g.Y && z >= 0 && z < g.Z) {
    g.data[x + g.X * (y + g.Y * z)] = c;
  }
}
function getVoxel(g, x, y, z) {
  if (x >= 0 && x < g.X && y >= 0 && y < g.Y && z >= 0 && z < g.Z) {
    return g.data[x + g.X * (y + g.Y * z)];
  }
  return 0;
}
function fillBox(g, x0, x1, y0, y1, z0, z1, c) {
  for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
    for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
      for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++)
        setVoxel(g, x, y, z, c);
}
function fillSym(g, xo0, xo1, y0, y1, z0, z1, c) {
  const cl = g.X / 2 - 1, cr = g.X / 2;
  fillBox(g, cl - xo1, cl - xo0, y0, y1, z0, z1, c);
  fillBox(g, cr + xo0, cr + xo1, y0, y1, z0, z1, c);
}

function buildHeroFighter() {
  const g = createGrid(32, 36, 20);
  fillSym(g, 0, 2, 4, 22, 6, 10, 1);
  fillSym(g, 0, 2, 4, 22, 5, 5, 2);
  fillSym(g, 0, 1, 23, 29, 6, 9, 1);
  fillSym(g, 0, 0, 30, 34, 7, 8, 1);
  fillSym(g, 0, 0, 6, 27, 10, 10, 3);
  fillSym(g, 0, 0, 33, 34, 7, 8, 3);
  fillSym(g, 0, 1, 18, 24, 11, 12, 5);
  fillSym(g, 0, 0, 20, 23, 13, 13, 6);
  fillSym(g, 1, 3, 2, 16, 4, 7, 2);
  fillSym(g, 2, 3, 2, 14, 5, 7, 1);
  fillSym(g, 2, 3, 1, 1, 5, 6, 4);
  fillSym(g, 2, 3, 0, 0, 5, 6, 7);
  for (let i = 0; i < 12; i++) {
    const ys = 7 + i, ye = 17 - Math.floor(i / 3);
    if (ys <= ye) fillSym(g, 3 + i, 3 + i, ys, ye, 8, 9, i < 10 ? 1 : 3);
  }
  fillSym(g, 5, 9, 11, 12, 9, 9, 3);
  fillSym(g, 7, 7, 13, 21, 7, 7, 4);
  for (let i = 0; i < 4; i++) fillSym(g, 2 + i, 2 + i, 23 + Math.floor(i/2), 26 - Math.floor(i/2), 8, 8, 1);
  fillSym(g, 5, 5, 24, 25, 8, 8, 3);
  for (let h = 0; h < 6; h++) fillSym(g, 3 + Math.floor(h/3), 3 + Math.floor(h/3), 3 + Math.floor(h/2), 9 - Math.floor(h/2), 10 + h, 10 + h, h < 4 ? 1 : 3);
  return g;
}

function buildHeroGerwalk() {
  const g = createGrid(32, 36, 28);
  fillSym(g, 0, 2, 6, 23, 16, 20, 1);
  fillSym(g, 0, 2, 6, 23, 15, 15, 2);
  fillSym(g, 0, 1, 24, 30, 16, 19, 1);
  fillSym(g, 0, 0, 31, 35, 17, 18, 1);
  fillSym(g, 0, 0, 8, 28, 20, 20, 3);
  fillSym(g, 0, 0, 34, 35, 17, 18, 3);
  fillSym(g, 0, 1, 19, 25, 21, 22, 5);
  fillSym(g, 0, 0, 21, 24, 23, 23, 6);
  for (let i = 0; i < 12; i++) {
    const ys = 9 + i, ye = 19 - Math.floor(i / 3);
    if (ys <= ye) fillSym(g, 3 + i, 3 + i, ys, ye, 18, 19, i < 10 ? 1 : 3);
  }
  fillSym(g, 5, 9, 13, 14, 19, 19, 3);
  for (let h = 0; h < 6; h++) fillSym(g, 3 + Math.floor(h/3), 3 + Math.floor(h/3), 5 + Math.floor(h/2), 11 - Math.floor(h/2), 20 + h, 20 + h, h < 4 ? 1 : 3);
  fillSym(g, 4, 5, 14, 17, 11, 15, 1);
  fillSym(g, 4, 5, 15, 23, 9, 11, 1);
  fillSym(g, 4, 5, 19, 20, 11, 11, 3);
  fillSym(g, 4, 5, 24, 25, 9, 11, 4);
  fillSym(g, 0, 1, 22, 32, 9, 10, 4);
  for (let s = 0; s < 6; s++) fillSym(g, 2, 4, 12 + s, 15 + s, 14 - s, 15 - s, 2);
  fillSym(g, 2, 4, 16, 19, 7, 9, 4);
  for (let s = 0; s < 7; s++) fillSym(g, 2, 4, 17 - s, 20 - s, 7 - s, 8 - s, 1);
  fillSym(g, 3, 4, 14, 16, 3, 6, 3);
  fillSym(g, 2, 4, 10, 16, 0, 1, 4);
  fillSym(g, 2, 4, 14, 17, 1, 2, 9);
  return g;
}

function buildHeroRobot() {
  const g = createGrid(32, 24, 40);
  fillSym(g, 2, 5, 9, 16, 0, 1, 4);
  fillSym(g, 2, 5, 12, 16, 1, 2, 9);
  fillSym(g, 2, 5, 10, 14, 3, 13, 1);
  fillSym(g, 5, 5, 11, 13, 5, 11, 3);
  fillSym(g, 3, 4, 14, 15, 11, 14, 9);
  fillSym(g, 2, 4, 10, 14, 14, 20, 2);
  fillSym(g, 0, 4, 9, 14, 20, 22, 1);
  fillSym(g, 0, 1, 9, 15, 20, 23, 3);
  fillSym(g, 0, 5, 9, 15, 23, 32, 1);
  fillSym(g, 0, 2, 14, 16, 24, 31, 9);
  fillSym(g, 0, 1, 15, 17, 25, 30, 5);
  fillSym(g, 3, 4, 14, 16, 27, 31, 3);
  fillSym(g, 1, 3, 6, 8, 22, 31, 2);
  for (let i = 0; i < 8; i++) fillSym(g, 4 + i, 4 + i, 6, 7, 24 - i, 31 - i, i < 6 ? 1 : 3);
  fillSym(g, 2, 2, 4, 6, 24, 32, 3);
  fillSym(g, 6, 9, 10, 14, 29, 33, 1);
  fillSym(g, 7, 9, 11, 13, 32, 33, 3);
  fillSym(g, 6, 8, 10, 13, 24, 28, 2);
  fillSym(g, 6, 9, 10, 14, 18, 23, 1);
  fillSym(g, 9, 9, 11, 13, 19, 22, 3);
  fillSym(g, 7, 8, 11, 13, 16, 17, 4);
  fillSym(g, 0, 2, 10, 14, 33, 37, 1);
  fillSym(g, 0, 1, 14, 15, 34, 35, 5);
  fillSym(g, 0, 0, 11, 14, 37, 38, 3);
  fillSym(g, 2, 2, 11, 12, 36, 39, 4);
  return g;
}

function buildEnemyFighter() {
  const g = createGrid(32, 36, 20);
  fillSym(g, 0, 2, 4, 21, 6, 10, 1);
  fillSym(g, 0, 2, 4, 21, 5, 5, 2);
  fillSym(g, 0, 1, 22, 29, 6, 9, 1);
  fillSym(g, 0, 0, 30, 35, 7, 8, 1);
  fillSym(g, 0, 0, 5, 26, 10, 10, 3);
  fillSym(g, 0, 0, 33, 35, 7, 8, 3);
  fillSym(g, 0, 1, 17, 23, 11, 12, 5);
  fillSym(g, 0, 0, 19, 22, 13, 13, 6);
  fillSym(g, 2, 4, 2, 16, 4, 7, 2);
  fillSym(g, 2, 4, 2, 14, 5, 7, 1);
  fillSym(g, 2, 4, 1, 1, 5, 6, 4);
  fillSym(g, 2, 4, 0, 0, 5, 6, 7);
  for (let i = 0; i < 11; i++) {
    const ys = 8 + Math.floor(i/2), ye = 15 + i;
    fillSym(g, 4 + i, 4 + i, ys, ye, 8, 9, 1);
    if (i >= 9) fillSym(g, 4 + i, 4 + i, ys - 2, ye + 3, 8, 9, 3);
  }
  fillSym(g, 6, 10, 12, 13, 9, 9, 3);
  fillSym(g, 5, 8, 3, 6, 7, 7, 2);
  for (let h = 0; h < 6; h++) fillSym(g, 3 + Math.floor(h/2), 3 + Math.floor(h/2), 2 + Math.floor(h/2), 8 - Math.floor(h/2), 10 + h, 10 + h, h < 4 ? 1 : 9);
  return g;
}

function buildEnemyGerwalk() {
  const g = createGrid(32, 36, 28);
  fillSym(g, 0, 2, 6, 22, 16, 20, 1);
  fillSym(g, 0, 2, 6, 22, 15, 15, 2);
  fillSym(g, 0, 1, 23, 30, 16, 19, 1);
  fillSym(g, 0, 0, 31, 35, 17, 18, 1);
  fillSym(g, 0, 0, 7, 27, 20, 20, 3);
  fillSym(g, 0, 0, 34, 35, 17, 18, 3);
  fillSym(g, 0, 1, 18, 24, 21, 22, 5);
  fillSym(g, 0, 0, 20, 23, 23, 23, 6);

    const ys = 10 + Math.floor(i/2), ye = 17 + i;
    fillSym(g, 4 + i, 4 + i, ys, ye, 18, 19, i < 9 ? 1 : 3);
    if (i >= 9) fillSym(g, 4 + i, 4 + i, ys - 2, ye + 3, 18, 19, 3);
  }
  for (let h = 0; h < 6; h++) fillSym(g, 3 + Math.floor(h/2), 3 + Math.floor(h/2), 4 + Math.floor(h/2), 10 - Math.floor(h/2), 20 + h, 20 + h, h < 4 ? 1 : 9);
  fillSym(g, 5, 6, 14, 17, 11, 15, 1);
  fillSym(g, 5, 6, 15, 27, 9, 11, 2);
  fillSym(g, 5, 6, 20, 24, 11, 11, 3);
  fillSym(g, 5, 6, 28, 30, 10, 10, 5);
  for (let s = 0; s < 6; s++) fillSym(g, 2, 4, 12 + s, 15 + s, 14 - s, 15 - s, 2);
  fillSym(g, 2, 4, 16, 20, 7, 9, 4);
  fillSym(g, 3, 3, 20, 21, 8, 9, 3);
  for (let s = 0; s < 7; s++) fillSym(g, 2, 4, 17 - s, 20 - s, 7 - s, 8 - s, 1);
  fillSym(g, 4, 4, 13, 16, 3, 6, 9);
  fillSym(g, 2, 4, 10, 17, 0, 1, 4);
  fillSym(g, 2, 2, 17, 18, 0, 1, 3);
  fillSym(g, 4, 4, 17, 18, 0, 1, 3);

function buildEnemyRobot() {
  const g = createGrid(32, 24, 40);

const MODELS = {
  hero: [buildHeroFighter(), buildHeroGerwalk(), buildHeroRobot()],
  enemy: [buildEnemyFighter(), buildEnemyGerwalk(), buildEnemyRobot()]
};

function extractSurfaceVoxels(grid, palette) {
  const list = [];
  for (let x = 0; x < grid.X; x++) {
    for (let y = 0; y < grid.Y; y++) {
      for (let z = 0; z < grid.Z; z++) {
        const c = getVoxel(grid, x, y, z);
        if (!c) continue;
        if (getVoxel(grid,x-1,y,z) && getVoxel(grid,x+1,y,z) &&
            getVoxel(grid,x,y-1,z) && getVoxel(grid,x,y+1,z) &&
            getVoxel(grid,x,y,z-1) && getVoxel(grid,x,y,z+1)) continue;
        list.push({
          x: x - grid.X / 2 + 0.5,
          y: z - grid.Z / 2 + 0.5,
          z: -(y - grid.Y / 2 + 0.5),
          color: palette[c]
        });
      }
    }
  }
  return list;
}

const SURFACE_CACHE = {
  hero: MODELS.hero.map(g => extractSurfaceVoxels(g, HERO_PALETTE)),
  enemy: MODELS.enemy.map(g => extractSurfaceVoxels(g, ENEMY_PALETTE))
};

// =========================================================
// 追加モデル（データ駆動）: models-extra.js の window.EXTRA_MODELS を
// MODELS / SURFACE_CACHE / UNIT_INFO へ登録する。
// 新しいモデルはデータファイルに1件足すだけで増やせる（.vox 由来）。
// =========================================================
const UNIT_INFO = {
  hero: { name: 'VALKYRIE VF-01 (白/赤)', formNames: ['FIGHTER', 'GERWALK', 'ROBOT'] },
  enemy: { name: 'DARK STEALTH ACE (黒/紫)', formNames: ['FIGHTER', 'GERWALK', 'ROBOT'] }
};
const PART_CACHE = {};
function gridFromQuads(dims, dataB64) {
  const g = createGrid(dims[0], dims[1], dims[2]);
  const bin = atob(dataB64);
  for (let i = 0; i + 3 < bin.length; i += 4) {
    setVoxel(g, bin.charCodeAt(i), bin.charCodeAt(i + 1), bin.charCodeAt(i + 2), bin.charCodeAt(i + 3));
  }
  return g;
}
// ロボット形態のボクセルを位置から脚・腕・前腕に分け、関節の回転中心を返す
function computeParts(list, pivot) {
  let minY = 1e9, maxY = -1e9, minX = 1e9, maxX = -1e9;
  for (const v of list) {
    if (v.y < minY) minY = v.y;
    if (v.y > maxY) maxY = v.y;
    if (v.x < minX) minX = v.x;
    if (v.x > maxX) maxX = v.x;
  }
  const H = maxY - minY, W = maxX - minX;
  const pv = pivot || {};
  const hipY = minY + H * 0.40 + (pv.hip || 0), shoulderY = minY + H * 0.80 + (pv.shoulder || 0), elbowY = minY + H * 0.58 + (pv.elbow || 0);
  const armX = W * 0.30 + (pv.armX || 0);
  return list.map(v => {
    if (v.y < hipY) return { part: v.x < 0 ? 'legL' : 'legR', py: hipY };
    if (Math.abs(v.x) > armX && v.y < shoulderY) {
      const side = v.x < 0 ? 'L' : 'R';
      if (v.y >= elbowY) return { part: 'arm' + side, py: shoulderY };
      return { part: 'fore' + side, py: shoulderY, ey: elbowY };
    }
    return null;
  });
}
if (window.EXTRA_MODELS) {
  for (const m of window.EXTRA_MODELS) {
    const pal = {};
    for (const k in m.palette) pal[k] = m.palette[k];
    MODELS[m.key] = m.forms.map(f => gridFromQuads(f.dims, f.data));
    SURFACE_CACHE[m.key] = MODELS[m.key].map(g => extractSurfaceVoxels(g, pal));
    UNIT_INFO[m.key] = { name: m.name + 'ロボット', formNames: m.formNames };
    PART_CACHE[m.key] = m.forms.map((f, i) => (m.robotForms || [1]).includes(i) ? computeParts(SURFACE_CACHE[m.key][i], m.pivot) : null);
  }
}

// 関節ポーズ: 0=なし 1=歩行 2=構え（両腕を前へ） 3=敬礼（右腕） 4=L字（前腕を肘で前に曲げる）
let poseMode = 0;
const POSE_LABELS = ['ポーズ: なし', 'ポーズ: 歩行', 'ポーズ: 構え', 'ポーズ: 敬礼', 'ポーズ: L字'];
function rotXAround(y, z, py, pz, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const dy = y - py, dz = z - pz;
  return [py + dy * c - dz * s, pz + dy * s + dz * c];
}
function posePoint(p, part, t) {
  const ph = performance.now() / 1000 * 7.0;
  let y = p.y, z = p.z;
  if (part.part === 'legL' || part.part === 'legR') {
    if (poseMode !== 1) return p;
    const ang = (part.part === 'legL' ? Math.sin(ph) : -Math.sin(ph)) * 0.45 * t;
    [y, z] = rotXAround(y, z, part.py, 0, ang);
    return { x: p.x, y, z };
  }
  const side = part.part.endsWith('L') ? 1 : -1;
  let swing = 0;
  if (poseMode === 1) swing = -side * Math.sin(ph) * 0.30 * t;
  else if (poseMode === 2) swing = 1.35 * t;
  else if (poseMode === 3) swing = side < 0 ? 1.35 * t : 0;
  else if (poseMode === 4) swing = 0.12 * t;
  [y, z] = rotXAround(y, z, part.py, 0, swing);
  if (part.part.startsWith('fore')) {
    let bend = 0;
    if (poseMode === 1) bend = (0.55 + 0.15 * side * Math.sin(ph)) * t;
    else if (poseMode === 2) bend = 0.10 * t;
    else if (poseMode === 3) bend = side < 0 ? 2.30 * t : 0;
    else if (poseMode === 4) bend = 1.5 * t;
    let ey = part.ey, ez = 0;
    [ey, ez] = rotXAround(ey, ez, part.py, 0, swing);
    [y, z] = rotXAround(y, z, ey, ez, bend);
  }
  return { x: p.x, y, z };
}

function updateMorphingUnit(unit, dt, slowMo) {
  const speed = slowMo ? 0.65 : 2.6;
  if (unit.morphT < 1.0) {
    unit.morphT = Math.min(1.0, unit.morphT + dt * speed);
  }
  const t = unit.morphT * unit.morphT * (3 - 2 * unit.morphT);
  const fromList = unit.fromVoxels;
  const toList = unit.toVoxels;
  const count = Math.max(fromList.length, toList.length);
  const bob = poseMode === 1 ? Math.abs(Math.sin(performance.now() / 1000 * 7.0)) * 0.8 * t : 0;

  for (let i = 0; i < MAX_INSTANCES; i++) {
    if (i >= count) {
      dummy.position.set(0, 0, 0);
      dummy.scale.set(0, 0, 0);
      dummy.updateMatrix();
      unit.mesh.setMatrixAt(i, dummy.matrix);
      continue;
    }
    const a = fromList[i % fromList.length];
    const b = toList[i % toList.length];
    const scA = i < fromList.length ? 1 : 0.01;
    const scB = i < toList.length ? 1 : 0.01;
    const sc = scA + (scB - scA) * t;

    let bx = b.x, by = b.y, bz = b.z;
    if (poseMode > 0) {
      const pc = PART_CACHE[unit.unitKey];
      const plist = pc ? pc[unit.targetForm] : null;
      if (plist) {
        const part = plist[i % toList.length];
        if (part) { const pp = posePoint(b, part, t); bx = pp.x; by = pp.y; bz = pp.z; }
      }
    }
    dummy.position.set(
      a.x + (bx - a.x) * t,
      a.y + (by - a.y) * t + bob,
      a.z + (bz - a.z) * t
    );
    dummy.scale.set(sc, sc, sc);
    dummy.updateMatrix();
    unit.mesh.setMatrixAt(i, dummy.matrix);

    tmpColor.setHex(t < 0.5 ? a.color : b.color);
    unit.mesh.setColorAt(i, tmpColor);
  }
  unit.mesh.instanceMatrix.needsUpdate = true;
  if (unit.mesh.instanceColor) unit.mesh.instanceColor.needsUpdate = true;
}

function triggerTransform(unit, newForm, playSfx = false) {
  if (unit.targetForm === newForm && unit.morphT >= 1.0) return;
  unit.fromVoxels = SURFACE_CACHE[unit.unitKey][unit.targetForm];
  unit.toVoxels = SURFACE_CACHE[unit.unitKey][newForm];
  unit.targetForm = newForm;
  unit.morphT = 0.0;
  if (playSfx) playTransformSound(newForm);
}

function firePlayerPrimary() {
  if (!inSortie || fireCooldown > 0) return;
  const form = playerUnit.targetForm;
  fireCooldown = form === 0 ? 0.11 : (form === 1 ? 0.16 : 0.22);
  playShootSound(false);
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerUnit.group.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(playerUnit.group.quaternion);
  const basePos = playerUnit.group.position.clone().addScaledVector(forward, 14);

  if (form === 0) {
    spawnProjectile(basePos.clone().addScaledVector(right, -5), forward, true, false);
    spawnProjectile(basePos.clone().addScaledVector(right, 5), forward, true, false);
  } else if (form === 1) {
    [-0.12, 0, 0.12].forEach(spread => {
      const d = forward.clone().addScaledVector(right, spread).normalize();
      spawnProjectile(basePos, d, true, false);
    });
  } else {
    spawnProjectile(basePos.clone().addScaledVector(right, -6), forward, true, false);
    spawnProjectile(basePos.clone().addScaledVector(right, 6), forward, true, false);
    spawnProjectile(basePos, forward, true, false);
  }
}

function prebakeSliceCanvases() {
  ['hero', 'enemy'].forEach(uKey => {
    const pal = uKey === 'hero' ? HERO_PALETTE : ENEMY_PALETTE;
    sliceCanvases[uKey] = MODELS[uKey].map(grid => {

      for (let z = 0; z < grid.Z; z++) {

        c.height = grid.Y;
        const ctx = c.getContext('2d');
        for (let x = 0; x < grid.X; x++) {
          for (let y = 0; y < grid.Y; y++) {
            const v = getVoxel(grid, x, y, z);
            if (v) {
              const hex = pal[v].toString(16).padStart(6, '0');
              ctx.fillStyle = `#${hex}`;
              ctx.fillRect(x, grid.Y - 1 - y, 1, 1);
            }
          }
        }
        slices.push(c);
      }
      return slices;
    });
  });
}
prebakeSliceCanvases();

function renderSpriteStackMode(time) {
  stackCanvas.width = window.innerWidth;
  stackCanvas.height = window.innerHeight;
  stackCtx.imageSmoothingEnabled = false;

  const slices = sliceCanvases[playerUnitKey][playerUnit.targetForm];
  const cx = stackCanvas.width / 2;
  const cy = stackCanvas.height / 2 + 50;
  const rotAngle = inSortie ? -playerUnit.group.rotation.y : time * 0.7;
  const scale = 7;

  // Draw top sheet strip
  const sheetY = 92;
  const miniScale = 1.6;
  const totalSheetW = slices.length * (slices[0].width * miniScale + 4);
  let sx = Math.max(20, (stackCanvas.width - totalSheetW) / 2);
  slices.forEach((sc, idx) => {
    stackCtx.strokeStyle = 'rgba(100,160,255,0.35)';
    stackCtx.strokeRect(sx - 1, sheetY - 1, sc.width * miniScale + 2, sc.height * miniScale + 2);
    stackCtx.drawImage(sc, sx, sheetY, sc.width * miniScale, sc.height * miniScale);
    sx += sc.width * miniScale + 4;
  });

  // Draw 2.5D stacked sprite
  slices.forEach((sc, z) => {
    stackCtx.save();
    stackCtx.translate(cx, cy - z * (scale * 0.85));
    stackCtx.rotate(rotAngle);
    stackCtx.scale(scale, scale * 0.72);
    stackCtx.drawImage(sc, -sc.width / 2, -sc.height / 2);
    stackCtx.restore();
  });
}

// =========================================================
// INPUT HANDLERS
// =========================================================
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Digit1') setForm(0);
  if (e.code === 'Digit2') setForm(1);
  if (e.code === 'Digit3') setForm(2);
  if (e.code === 'Tab') {
    e.preventDefault();
    setForm((playerUnit.targetForm + 1) % 3);
  }
  if (e.code === 'KeyE') firePlayerMissile();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

window.addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  if (e.button === 0) {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    if (inSortie) firePlayerPrimary();
  } else if (e.button === 2) {
    firePlayerMissile();
  }
});
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  camYaw -= (e.clientX - lastMouseX) * 0.008;
  camPitch = Math.max(-0.4, Math.min(1.2, camPitch + (e.clientY - lastMouseY) * 0.008));
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('wheel', e => {
  camDist = Math.max(24, Math.min(110, camDist + e.deltaY * 0.04));
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========================================================
// MAIN SIMULATION LOOP
// =========================================================
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updateMorphingUnit(playerUnit, dt, slowMo);
  updateMorphingUnit(enemyUnit, dt, slowMo);

  if (fireCooldown > 0) fireCooldown -= dt;
  if (missileCooldown > 0) missileCooldown -= dt;

  if (!inSortie) {
    if (!isDragging) playerUnit.group.rotation.y += dt * 0.45;
  } else {
    // Player flight & mech controls
    const form = playerUnit.targetForm;
    const boosting = keys['ShiftLeft'] && playerBoost > 5;
    if (boosting) playerBoost = Math.max(0, playerBoost - dt * 32);
    else playerBoost = Math.min(100, playerBoost + dt * 18);

    const baseSpeed = form === 0 ? 78 : (form === 1 ? 42 : 24);
    const speed = boosting ? baseSpeed * 1.75 : baseSpeed;
    const turnRate = form === 0 ? 1.5 : 2.1;

    if (keys['KeyA'] || keys['ArrowLeft']) playerUnit.group.rotation.y += turnRate * dt;
    if (keys['KeyD'] || keys['ArrowRight']) playerUnit.group.rotation.y -= turnRate * dt;

    if (form === 0) {
      if (keys['KeyW'] || keys['ArrowUp']) playerUnit.group.rotation.x -= 1.2 * dt;
      if (keys['KeyS'] || keys['ArrowDown']) playerUnit.group.rotation.x += 1.2 * dt;
      playerUnit.group.rotation.x = Math.max(-0.85, Math.min(0.85, playerUnit.group.rotation.x));
    } else {
      playerUnit.group.rotation.x *= 0.9;
      if (keys['KeyW'] || keys['ArrowUp']) playerUnit.group.position.y += 38 * dt;
      if (keys['KeyS'] || keys['ArrowDown']) playerUnit.group.position.y -= 38 * dt;
    }

    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerUnit.group.quaternion);
    playerUnit.group.position.addScaledVector(forward, speed * dt);
    playerUnit.group.position.y = Math.max(-140, Math.min(260, playerUnit.group.position.y));

    if (keys['Space']) firePlayerPrimary();

    // Enemy AI
    if (enemyUnit.group.visible) {
      const toPlayer = playerUnit.group.position.clone().sub(enemyUnit.group.position);
      const dist = toPlayer.length();
      enemyUnit.group.lookAt(playerUnit.group.position);
      enemyUnit.group.rotateY(Math.PI);

      enemyAiTimer += dt;
      if (enemyAiTimer > 3.5) {
        enemyAiTimer = 0;
        const desiredForm = dist > 160 ? 0 : (dist > 85 ? 1 : 2);
        triggerTransform(enemyUnit, desiredForm, false);
      }
      const enemySpeed = dist > 90 ? 52 : 18;
      enemyUnit.group.position.addScaledVector(toPlayer.normalize(), enemySpeed * dt);

      enemyFireTimer += dt;
      if (enemyFireTimer > 1.25 && dist < 320) {
        enemyFireTimer = 0;
        const shotDir = playerUnit.group.position.clone().sub(enemyUnit.group.position).normalize();
        spawnProjectile(enemyUnit.group.position.clone(), shotDir, false, false);
      }
    }

    // Update projectiles
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.life -= dt;
      if (b.isMissile && b.isPlayer && enemyUnit.group.visible) {
        const desired = enemyUnit.group.position.clone().sub(b.mesh.position).normalize();
        b.vel.lerp(desired.multiplyScalar(190), dt * 4.5);
        b.mesh.lookAt(b.mesh.position.clone().add(b.vel));
      }
      b.mesh.position.addScaledVector(b.vel, dt);

      let hit = false;
      if (b.isPlayer && enemyUnit.group.visible && b.mesh.position.distanceTo(enemyUnit.group.position) < 16) {
        enemyHP -= b.isMissile ? 32 : 10;
        hit = true;
        spawnExplosion(b.mesh.position, 0xc084fc, 6);
        if (enemyHP <= 0) {
          spawnExplosion(enemyUnit.group.position, 0xff2d4b, 38);
          score += 100 * wave;
          spawnWave(wave + 1);
        }
      } else if (!b.isPlayer && b.mesh.position.distanceTo(playerUnit.group.position) < 14) {
        playerHP = Math.max(0, playerHP - 8);
        hit = true;
        spawnExplosion(b.mesh.position, 0x38bdf8, 6);
        if (playerHP <= 0) {
          showBanner('UNIT DAMAGED — EMERGENCY REPAIR');
          playerHP = 100;
        }
      }

      if (hit || b.life <= 0) {
        scene.remove(b.mesh);
        bullets.splice(i, 1);
      }
    }

    // HUD updates
    document.getElementById('hp-bar').style.width = `${playerHP}%`;
    document.getElementById('hp-val').textContent = `${Math.round(playerHP)}%`;
    document.getElementById('boost-bar').style.width = `${playerBoost}%`;
    document.getElementById('boost-val').textContent = `${Math.round(playerBoost)}%`;
    const ePct = Math.max(0, Math.round((enemyHP / enemyMaxHP) * 100));
    document.getElementById('enemy-hp-bar').style.width = `${ePct}%`;
    document.getElementById('enemy-hp-val').textContent = `${ePct}%`;
    document.getElementById('score-val').textContent = score;
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.scale.multiplyScalar(0.94);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }

  // Camera update
  if (orbitCam || !inSortie) {
    const target = playerUnit.group.position;
    camera.position.set(
      target.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
      target.y + Math.sin(camPitch) * camDist + 4,
      target.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
    );
    camera.lookAt(target);
  } else {
    const offset = new THREE.Vector3(0, 14, 46).applyQuaternion(playerUnit.group.quaternion);
    const desiredCam = playerUnit.group.position.clone().add(offset);
    camera.position.lerp(desiredCam, Math.min(1, dt * 8));
    const lookTarget = playerUnit.group.position.clone().add(
      new THREE.Vector3(0, 3, -40).applyQuaternion(playerUnit.group.quaternion)
    );
    camera.lookAt(lookTarget);
  }

  if (isSpriteStackView) {
    renderSpriteStackMode(now / 1000);
  } else {
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(animate);
</script>
